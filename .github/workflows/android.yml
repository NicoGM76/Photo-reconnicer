name: Compilar AnimalScan APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build v1, v2 y v3
        run: gradle :app:assembleV1Debug :app:assembleV2Debug :app:assembleV3Debug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AnimalScan-APK-v1-v2-v3
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
